# Transport-only fixture; no application or PostgreSQL readiness claim.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {}
http {
    access_log off;
    server {
        listen 8080;
        location = /health/live { default_type application/json; return 200 '{"status":"transport-ready"}'; }
        location / { return 404; }
    }
}
