---
schema_version: 1
topology: single-host
host:
  hostname: secpal-host.example.invalid
  architecture: amd64
  public_address: 192.0.2.10
  private_addresses: [10.0.0.10]
  require_clock_synchronized: true
service_account:
  name: secpal-deploy
  group: secpal-deploy
  uid: 20000
  gid: 20000
  home: /var/lib/secpal
  shell: /usr/sbin/nologin
  interactive_login: false
  docker_authority: false
origins:
  frontend: https://app.example.invalid
  api: https://api.example.invalid
paths:
  configuration: &service-path
    path: /srv/secpal/config
    owner_role: service-account
    uid: 20000
    gid: 20000
    mode: "0750"
    lifecycle: persistent
    decision_issue: null
  deployment_state:
    <<: *service-path
    path: /srv/secpal/deployment-state
  runtime_secrets:
    path: /run/secpal/secrets
    owner_role: state-contract
    uid: null
    gid: null
    mode: "0750"
    lifecycle: reconstructable
    decision_issue: 10
  postgresql_data:
    path: /srv/secpal/postgresql
    owner_role: state-contract
    uid: null
    gid: null
    mode: "0700"
    lifecycle: persistent
    decision_issue: 10
  private_application_storage: &api-storage
    path: /srv/secpal/private-storage
    owner_role: api-runtime
    uid: 10001
    gid: 10001
    mode: "0750"
    lifecycle: persistent
    decision_issue: null
  public_application_storage:
    <<: *api-storage
    path: /srv/secpal/public-storage
    decision_issue: 10
  edge_state:
    path: /srv/secpal/edge
    owner_role: edge-contract
    uid: null
    gid: null
    mode: "0750"
    lifecycle: persistent
    decision_issue: 11
  acme_state:
    path: /srv/secpal/acme
    owner_role: tls-contract
    uid: null
    gid: null
    mode: "0700"
    lifecycle: persistent
    decision_issue: 13
  crowdsec_state:
    path: /srv/secpal/crowdsec
    owner_role: crowdsec-contract
    uid: null
    gid: null
    mode: "0750"
    lifecycle: persistent
    decision_issue: 14
  logs:
    <<: *service-path
    path: /srv/secpal/logs
    lifecycle: reconstructable
  backup_staging:
    <<: *service-path
    path: /srv/secpal/backup-staging
    mode: "0700"
    lifecycle: reconstructable
    decision_issue: 15
  docker_data_root:
    path: /var/lib/docker
    owner_role: docker-daemon
    uid: 0
    gid: 0
    mode: "0711"
    lifecycle: persistent
    decision_issue: null
resources:
  logical_cpus: 4
  memory_bytes: 8589934592
  storage_total_bytes: 107374182400
  total_inodes: 1000000
  storage:
    docker_data: &large-headroom
      minimum_free_bytes: 21474836480
      minimum_free_percent: 20
      minimum_free_inodes: 200000
      minimum_free_inode_percent: 20
    postgresql_data: *large-headroom
    private_application_storage:
      minimum_free_bytes: 10737418240
      minimum_free_percent: 20
      minimum_free_inodes: 100000
      minimum_free_inode_percent: 20
    logs: &small-headroom
      minimum_free_bytes: 5368709120
      minimum_free_percent: 20
      minimum_free_inodes: 50000
      minimum_free_inode_percent: 20
    edge_state:
      minimum_free_bytes: 2147483648
      minimum_free_percent: 20
      minimum_free_inodes: 20000
      minimum_free_inode_percent: 20
    acme_state:
      minimum_free_bytes: 1073741824
      minimum_free_percent: 20
      minimum_free_inodes: 20000
      minimum_free_inode_percent: 20
    crowdsec_state:
      minimum_free_bytes: 2147483648
      minimum_free_percent: 20
      minimum_free_inodes: 50000
      minimum_free_inode_percent: 20
    backup_staging:
      <<: *small-headroom
      minimum_free_bytes: 10737418240
backup:
  target_type: external-filesystem
  target_identifier: example-backup-target
  credential_reference: external-secret://backup/example-target
features:
  image_verification: true
  mail_delivery: false
  opentimestamps: false
  bitcoin_quorum: false
  address_data_imports: false
  android_push: false
  web_push: false
  object_storage: false
