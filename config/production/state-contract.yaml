---
schema_version: 1

# Podman's default rootless mapping: container 0 maps to the service account;
# container IDs 1..65536 map in order to the single subordinate range.
rootless_mapping:
  method: podman-default-single-range
  service_uid: 20000
  service_gid: 20000
  uid_start: 100000
  gid_start: 200000
  count: 65536

state_policy:
  initialization_marker: /srv/secpal/deployment-state/state-layout-v1
  marker_mode: "0640"
  marker_content: secpal-production-state-v1
  first_install_requires_explicit_ack: true

log_policy:
  driver: k8s-file
  directory: /srv/secpal/logs
  file_name: "{container_name}.log"
  maximum_file_size: 10mb
  consumer_access: none

secret_policy:
  max_previous_keys: 3
  delivery_root: /run/secpal/secrets
  publication: operator-atomic-complete-set
  acl: access-only-base-entries-no-default-acl

secret_delivery:
  api:
    consumers: [api, migrate, scheduler, worker-general, worker-hash-chain]
    container_uid: 10001
    container_gid: 10001
    directory: /run/secpal/secrets/api
    directory_mode: "0710"
    files:
      app-key:
        mode: "0400"
        type: app-key
      app-previous-keys:
        mode: "0400"
        type: app-previous-keys
      tenant-kek:
        mode: "0600"
        type: tenant-kek
      postgres-password:
        mode: "0400"
        type: password
      valkey-password:
        mode: "0400"
        type: password
  postgres:
    consumers: [postgres]
    container_uid: 999
    container_gid: 999
    directory: /run/secpal/secrets/postgres
    directory_mode: "0710"
    files:
      password:
        mode: "0400"
        type: password
  valkey:
    consumers: [valkey]
    container_uid: 10002
    container_gid: 10002
    directory: /run/secpal/secrets/valkey
    directory_mode: "0710"
    files:
      password:
        mode: "0400"
        type: password

objects:
  postgresql_data:
    authority: postgresql
    durability: durable
    reconstructable: false
    loss_acceptable: false
    restore_required: true
    backup: required-d7
    confidentiality: restricted-business-data
    integrity: business-critical
    location: /srv/secpal/postgresql
    consumers: [postgres]
    container_identity: "999:999"
    host_ownership: mapped-postgres
    type: directory
    owner: mapped-container-uid-999
    group: mapped-container-gid-999
    mode: "0700"
    acl: access-only-base-entries-no-default-acl
    initialization_authority: operator-state-preparation
    rotation_migration_authority: reviewed-postgresql-migration
    destruction_authority: explicit-operator-data-destruction
  private_application_storage:
    authority: secpal-api
    durability: durable
    reconstructable: false
    loss_acceptable: false
    restore_required: true
    backup: required-d7
    confidentiality: restricted-business-data
    integrity: business-critical
    location: /srv/secpal/private-storage
    consumers: [api, migrate, scheduler, worker-general, worker-hash-chain]
    container_identity: "10001:10001"
    host_ownership: mapped-api
    type: directory
    owner: mapped-container-uid-10001
    group: mapped-container-gid-10001
    mode: "0750"
    acl: access-only-base-entries-no-default-acl
    initialization_authority: operator-state-preparation
    rotation_migration_authority: reviewed-storage-layout-migration
    destruction_authority: explicit-operator-data-destruction
  public_application_storage:
    authority: secpal-api
    durability: durable
    reconstructable: false
    loss_acceptable: false
    restore_required: true
    backup: required-d7
    confidentiality: application-public-after-authorization
    integrity: business-critical
    location: /srv/secpal/public-storage
    consumers: [api, migrate, scheduler, worker-general, worker-hash-chain]
    container_identity: "10001:10001"
    host_ownership: mapped-api
    type: directory
    owner: mapped-container-uid-10001
    group: mapped-container-gid-10001
    mode: "0750"
    acl: access-only-base-entries-no-default-acl
    initialization_authority: operator-state-preparation
    rotation_migration_authority: reviewed-storage-layout-migration
    destruction_authority: explicit-operator-data-destruction
  app_key:
    authority: security-operator
    durability: stable-external-secret
    reconstructable: false
    loss_acceptable: false
    restore_required: true
    backup: external-secret-recovery-required
    confidentiality: secret
    integrity: cryptographic-critical
    location: external-authority://application/app-key
    consumers: [api, migrate, scheduler, worker-general, worker-hash-chain]
    container_identity: "10001:10001"
    host_ownership: mapped-api-delivery-copy
    type: laravel-base64-key-file
    owner: mapped-container-uid-10001
    group: mapped-container-gid-10001
    mode: "0400"
    acl: access-only-base-entries-no-default-acl
    initialization_authority: external-security-operator
    rotation_migration_authority: reviewed-app-key-rotation
    destruction_authority: security-operator-after-recovery-retirement
  app_previous_keys:
    authority: security-operator
    durability: reviewed-rotation-secret
    reconstructable: false
    loss_acceptable: false
    restore_required: while-active
    backup: external-secret-recovery-required
    confidentiality: secret
    integrity: cryptographic-critical
    location: external-authority://application/app-previous-keys
    consumers: [api, migrate, scheduler, worker-general, worker-hash-chain]
    container_identity: "10001:10001"
    host_ownership: mapped-api-delivery-copy
    type: bounded-key-list-file
    owner: mapped-container-uid-10001
    group: mapped-container-gid-10001
    mode: "0400"
    acl: access-only-base-entries-no-default-acl
    initialization_authority: external-security-operator
    rotation_migration_authority: reviewed-app-key-rotation
    destruction_authority: security-operator-after-explicit-retirement
  tenant_kek:
    authority: security-operator
    durability: stable-external-secret
    reconstructable: false
    loss_acceptable: false
    restore_required: true
    backup: external-secret-recovery-required
    confidentiality: highest-secret
    integrity: cryptographic-critical
    location: external-authority://application/tenant-kek
    consumers: [api, migrate, scheduler, worker-general, worker-hash-chain]
    container_identity: "10001:10001"
    host_ownership: mapped-api-delivery-copy
    type: raw-32-byte-file
    owner: mapped-container-uid-10001
    group: mapped-container-gid-10001
    mode: "0600"
    acl: access-only-base-entries-no-default-acl
    initialization_authority: external-security-operator
    rotation_migration_authority: reviewed-kek-rewrap-operation
    destruction_authority: security-operator-after-verified-rewrap-recovery
  postgresql_credentials:
    authority: security-operator
    durability: stable-external-secret
    reconstructable: false
    loss_acceptable: false
    restore_required: true
    backup: external-secret-recovery-required
    confidentiality: secret
    integrity: authentication-critical
    location: external-authority://data/postgresql-password
    consumers: [api-roles, postgres]
    container_identity: per-consumer-copy
    host_ownership: mapped-exact-consumer
    type: password-file
    owner: mapped-exact-consumer
    group: mapped-exact-consumer
    mode: "0400"
    acl: access-only-base-entries-no-default-acl
    initialization_authority: external-security-operator
    rotation_migration_authority: reviewed-database-credential-rotation
    destruction_authority: security-operator-after-cutover
  valkey_credentials:
    authority: security-operator
    durability: stable-external-secret
    reconstructable: false
    loss_acceptable: false
    restore_required: true
    backup: external-secret-recovery-required
    confidentiality: secret
    integrity: authentication-critical
    location: external-authority://data/valkey-password
    consumers: [api-roles, valkey]
    container_identity: per-consumer-copy
    host_ownership: mapped-exact-consumer
    type: password-file
    owner: mapped-exact-consumer
    group: mapped-exact-consumer
    mode: "0400"
    acl: access-only-base-entries-no-default-acl
    initialization_authority: external-security-operator
    rotation_migration_authority: reviewed-valkey-credential-rotation
    destruction_authority: security-operator-after-cutover
  external_service_credentials:
    authority: feature-owner
    durability: stable-external-secret-when-enabled
    reconstructable: false
    loss_acceptable: feature-dependent
    restore_required: when-feature-enabled
    backup: external-secret-recovery-when-enabled
    confidentiality: secret
    integrity: authentication-critical
    location: external-authority://feature-gated/disabled
    consumers: []
    container_identity: none-while-disabled
    host_ownership: none-while-disabled
    type: feature-specific-secret-file
    owner: feature-specific-mapped-consumer
    group: feature-specific-mapped-consumer
    mode: "0400"
    acl: access-only-base-entries-no-default-acl
    initialization_authority: reviewed-feature-enablement
    rotation_migration_authority: feature-owner
    destruction_authority: feature-owner-after-disablement
  valkey_state:
    authority: valkey
    durability: durable-aof-everysec
    reconstructable: partially-from-postgresql
    loss_acceptable: bounded-crash-window-only
    restore_required: continuity-required
    backup: required-d7-coordinated
    confidentiality: restricted-operational-data
    integrity: queue-continuity
    location: /srv/secpal/valkey
    consumers: [valkey]
    container_identity: "10002:10002"
    host_ownership: mapped-valkey
    type: directory
    owner: mapped-container-uid-10002
    group: mapped-container-gid-10002
    mode: "0700"
    acl: access-only-base-entries-no-default-acl
    initialization_authority: operator-state-preparation
    rotation_migration_authority: reviewed-valkey-migration
    destruction_authority: explicit-operator-queue-recovery-decision
  acme_state:
    authority: future-edge-tls-operator
    durability: durable-reserved
    reconstructable: rate-limit-constrained
    loss_acceptable: false-after-activation
    restore_required: after-activation
    backup: required-d7-after-activation
    confidentiality: contains-account-and-private-key-material
    integrity: tls-critical
    location: /srv/secpal/acme
    consumers: []
    container_identity: deferred-to-edge-contract
    host_ownership: deferred-to-edge-contract
    type: reserved-directory
    owner: deferred-to-edge-contract
    group: deferred-to-edge-contract
    mode: "0700"
    acl: access-only-base-entries-no-default-acl
    initialization_authority: future-edge-tls-installation
    rotation_migration_authority: future-edge-tls-operator
    destruction_authority: future-edge-tls-operator
  crowdsec_state:
    authority: future-crowdsec-operator
    durability: durable-reserved
    reconstructable: partially
    loss_acceptable: false-after-activation
    restore_required: reviewed-at-activation
    backup: d7-policy-after-activation
    confidentiality: restricted-security-state
    integrity: security-critical
    location: /srv/secpal/crowdsec
    consumers: []
    container_identity: deferred-to-crowdsec-contract
    host_ownership: deferred-to-crowdsec-contract
    type: reserved-directory
    owner: deferred-to-crowdsec-contract
    group: deferred-to-crowdsec-contract
    mode: "0750"
    acl: access-only-base-entries-no-default-acl
    initialization_authority: future-crowdsec-installation
    rotation_migration_authority: future-crowdsec-operator
    destruction_authority: future-crowdsec-operator
  logs:
    authority: rootless-podman-and-operator
    durability: bounded-retention
    reconstructable: false
    loss_acceptable: retention-policy-only
    restore_required: false
    backup: excluded
    confidentiality: restricted-operational-data
    integrity: audit-supporting-not-authoritative
    location: /srv/secpal/logs
    consumers: []
    container_identity: none-host-side-k8s-file-driver
    host_ownership: service-account
    type: directory
    owner: service-account-uid
    group: service-account-gid
    mode: "0750"
    acl: access-only-base-entries-no-default-acl
    initialization_authority: operator-installation
    rotation_migration_authority: operator-log-policy
    destruction_authority: bounded-retention-policy
  configuration:
    authority: operator-root
    durability: durable-declarative
    reconstructable: true
    loss_acceptable: temporarily
    restore_required: reinstall-or-reconcile
    backup: recommended-d7
    confidentiality: non-secret-restricted
    integrity: startup-critical
    location: /srv/secpal/config
    consumers: [systemd-user, product-roles]
    container_identity: read-only-selected-files
    host_ownership: root-service-group
    type: directory
    owner: root
    group: service-account-gid
    mode: "0750"
    acl: access-only-base-entries-no-default-acl
    initialization_authority: operator-installation
    rotation_migration_authority: reviewed-deployment-change
    destruction_authority: operator-after-reinstall-proof
  deployment_state:
    authority: operator-root
    durability: durable-declarative
    reconstructable: true
    loss_acceptable: temporarily
    restore_required: reinstall-or-reconcile
    backup: recommended-d7
    confidentiality: non-secret-restricted
    integrity: rollback-critical
    location: /srv/secpal/deployment-state
    consumers: [operator-tooling]
    container_identity: none
    host_ownership: root-service-group
    type: directory
    owner: root
    group: service-account-gid
    mode: "0750"
    acl: access-only-base-entries-no-default-acl
    initialization_authority: operator-installation
    rotation_migration_authority: reviewed-deployment-change
    destruction_authority: operator-after-reconciliation
  backup_encryption_credentials:
    authority: backup-operator-external
    durability: stable-external-secret
    reconstructable: false
    loss_acceptable: false
    restore_required: true
    backup: separately-escrowed-never-in-backup-payload
    confidentiality: highest-secret
    integrity: recovery-critical
    location: external-authority://infrastructure/backup-encryption
    consumers: []
    container_identity: none
    host_ownership: outside-product-authority
    type: external-secret
    owner: backup-operator
    group: backup-operator
    mode: external-authority-policy
    acl: no-product-access
    initialization_authority: backup-operator
    rotation_migration_authority: backup-operator
    destruction_authority: backup-operator-after-retention-expiry
  tls_private_keys:
    authority: edge-tls-operator
    durability: stable-infrastructure-secret
    reconstructable: reissuable-with-constraints
    loss_acceptable: false-after-activation
    restore_required: edge-policy
    backup: d7-edge-policy
    confidentiality: highest-secret
    integrity: tls-critical
    location: external-authority://infrastructure/tls
    consumers: []
    container_identity: none-in-d2
    host_ownership: outside-product-authority
    type: external-secret
    owner: edge-tls-operator
    group: edge-tls-operator
    mode: external-authority-policy
    acl: no-product-access
    initialization_authority: future-edge-tls-installation
    rotation_migration_authority: edge-tls-operator
    destruction_authority: edge-tls-operator
  operator_ssh_credentials:
    authority: human-operator
    durability: external-operator-identity
    reconstructable: replaceable
    loss_acceptable: only-after-replacement
    restore_required: external-access-recovery
    backup: outside-d7-product-backup
    confidentiality: highest-secret
    integrity: host-access-critical
    location: external-authority://operator/ssh
    consumers: []
    container_identity: none
    host_ownership: outside-product-authority
    type: external-credential
    owner: human-operator
    group: human-operator
    mode: external-authority-policy
    acl: no-product-access
    initialization_authority: operator-access-management
    rotation_migration_authority: operator-access-management
    destruction_authority: operator-access-management
  github_credentials:
    authority: human-or-ci-operator
    durability: external-operator-identity
    reconstructable: replaceable
    loss_acceptable: only-after-replacement
    restore_required: false-for-public-image-consumption
    backup: outside-d7-product-backup
    confidentiality: highest-secret
    integrity: supply-chain-critical-when-used
    location: external-authority://operator/github
    consumers: []
    container_identity: none
    host_ownership: outside-product-authority
    type: external-credential
    owner: human-or-ci-operator
    group: human-or-ci-operator
    mode: external-authority-policy
    acl: no-product-access
    initialization_authority: operator-access-management
    rotation_migration_authority: operator-access-management
    destruction_authority: operator-access-management
  registry_credentials:
    authority: registry-operator
    durability: absent-for-official-public-images
    reconstructable: replaceable-if-future-private-registry
    loss_acceptable: true-for-current-contract
    restore_required: false
    backup: excluded
    confidentiality: highest-secret-if-introduced
    integrity: supply-chain-critical-if-introduced
    location: external-authority://operator/registry-absent
    consumers: []
    container_identity: none
    host_ownership: outside-product-authority
    type: absent-external-credential
    owner: registry-operator
    group: registry-operator
    mode: external-authority-policy
    acl: no-product-access
    initialization_authority: prohibited-in-d2
    rotation_migration_authority: future-reviewed-registry-contract
    destruction_authority: registry-operator
