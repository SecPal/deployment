[Service]
# Own only #104's table; never run the distribution's global ruleset flush.
ExecStart=
ExecStart=/usr/bin/python3 -I /usr/local/libexec/secpal/host-firewall --restore
ExecStartPost=
ExecStartPost=/usr/bin/python3 -I /usr/local/libexec/secpal/host-firewall --check
# #81 intentionally disables global reload; use the checked --apply interface.
ExecReload=
# Keep the accepted ingress policy through stop/restart and startup failure.
ExecStop=
ExecStopPost=
UMask=0077
NoNewPrivileges=true
CapabilityBoundingSet=CAP_NET_ADMIN
ProtectSystem=strict
ReadWritePaths=/var/lib/secpal/host-firewall
PrivateTmp=true
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
RestrictSUIDSGID=true
RestrictRealtime=true
RestrictNamespaces=true
LockPersonality=true
RestrictAddressFamilies=AF_NETLINK AF_UNIX
