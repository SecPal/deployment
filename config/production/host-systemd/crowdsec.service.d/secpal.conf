[Unit]
# Security health is independent of product availability.
After=systemd-journald.service

[Service]
User=secpal-crowdsec
Group=secpal-crowdsec
SupplementaryGroups=systemd-journal
EnvironmentFile=
Environment=
Environment=PATH=/usr/bin:/usr/sbin LANG=C LC_ALL=C
ExecStartPre=
ExecStartPre=/usr/bin/python3 -I /usr/local/libexec/secpal/crowdsec-host --check-inputs
ExecStart=
ExecStart=/usr/bin/crowdsec -c /usr/share/secpal/crowdsec/secpal.yaml
ExecReload=
# Restart re-admits immutable inputs; there is no unchecked HUP/Hub reload.
Type=notify
Restart=on-failure
RestartSec=10s
LoadCredential=local-api:/etc/secpal/credentials/crowdsec-local-api.yaml
RuntimeDirectory=secpal-crowdsec
RuntimeDirectoryMode=0750
UMask=0007
UnsetEnvironment=LD_PRELOAD LD_LIBRARY_PATH PYTHONPATH PYTHONHOME
NoNewPrivileges=true
CapabilityBoundingSet=
AmbientCapabilities=
ProtectSystem=strict
ReadWritePaths=/srv/secpal/crowdsec /run/secpal-crowdsec
ProtectHome=true
PrivateTmp=true
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
RestrictNamespaces=true
RestrictSUIDSGID=true
RestrictRealtime=true
LockPersonality=true
RestrictAddressFamilies=AF_UNIX
SocketBindDeny=any
InaccessiblePaths=-/etc/secpal/credentials -/etc/ssh -/etc/letsencrypt -/etc/pki -/srv/secpal/acme -/etc/haproxy/secpal-viewer.pem -/var/lib/pgsql -/run/docker.sock -/run/podman -/run/user -/srv/secpal/secrets -/srv/secpal/postgresql
