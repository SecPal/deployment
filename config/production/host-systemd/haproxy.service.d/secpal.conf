[Unit]
BindsTo=secpal-product-backend-policy.service
After=secpal-product-backend-policy.service

[Service]
# Retain the Rocky package's host-native notify/master-worker service identity.
# Clear all distribution optional fragments/environment/runtime arguments.
EnvironmentFile=
Environment=
UnsetEnvironment=CONFIG CFGDIR PIDFILE OPTIONS LD_PRELOAD LD_LIBRARY_PATH
ExecStartPre=
ExecStartPre=/usr/bin/python3 -I /usr/local/libexec/secpal/haproxy-config --check
ExecStart=
ExecStart=/usr/sbin/haproxy -Ws -f /etc/haproxy/secpal.cfg -p /run/haproxy/secpal.pid
ExecReload=
ExecReload=/usr/bin/python3 -I /usr/local/libexec/secpal/haproxy-config --reload $MAINPID
Type=notify
KillMode=mixed
TimeoutStartSec=120s
TimeoutStopSec=40s
RuntimeDirectory=haproxy
RuntimeDirectoryMode=0755
UMask=0077
NoNewPrivileges=true
ProtectSystem=strict
ReadWritePaths=/etc/haproxy /run/haproxy
ProtectHome=true
PrivateTmp=true
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
CapabilityBoundingSet=CAP_SETUID CAP_SETGID CAP_NET_BIND_SERVICE
InaccessiblePaths=-/run/docker.sock -/run/podman -/run/user -/var/lib/containers -/srv/secpal/secrets
# The separately rendered listener drop-in admits only the typed TCP ports.
SocketBindDeny=any
StandardOutput=journal
StandardError=journal
SyslogIdentifier=secpal-haproxy
