[crowdsec]
spoe-agent secpal-inspection
    groups crowdsec-http-body crowdsec-http-no-body
    option var-prefix crowdsec
    option set-on-error error
    option continue-on-error
    timeout hello 300ms
    timeout processing 900ms
    use-backend secpal_spoa

spoe-message crowdsec-http-body
    args id=unique-id method=method path=path query=query version=req.ver headers=req.hdrs body=req.body url=url ssl=ssl_fc src-ip=src src-port=src_port

spoe-message crowdsec-http-no-body
    args id=unique-id method=method path=path query=query version=req.ver headers=req.hdrs url=url ssl=ssl_fc src-ip=src src-port=src_port

spoe-group crowdsec-http-body
    messages crowdsec-http-body

spoe-group crowdsec-http-no-body
    messages crowdsec-http-no-body
