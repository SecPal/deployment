---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "04:00"
      timezone: Europe/Berlin
    # CodeQL init and analyze must use the same release.
    groups:
      github-actions-patch:
        patterns: ["github/codeql-action/*"]
        update-types: ["patch"]
      github-actions-minor:
        patterns: ["github/codeql-action/*"]
        update-types: ["minor"]
      github-actions-major:
        patterns: ["github/codeql-action/*"]
        update-types: ["major"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "04:00"
      timezone: Europe/Berlin
  - package-ecosystem: pip
    directories:
      - /requirements/build
      - /requirements/integration
      - /requirements/qualification
      - /requirements/quality
      - /requirements/schema
    schedule:
      interval: daily
      time: "04:00"
      timezone: Europe/Berlin
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: daily
      time: "04:00"
      timezone: Europe/Berlin
  - package-ecosystem: docker
    directory: /containers/phase-b-gateway
    schedule:
      interval: daily
      time: "04:00"
      timezone: Europe/Berlin
  - package-ecosystem: opentofu
    directory: /infra/ci-cloud/digitalocean
    schedule:
      interval: daily
      time: "04:00"
      timezone: Europe/Berlin
  - package-ecosystem: opentofu
    directory: /infra/ci-cloud/gcp
    schedule:
      interval: daily
      time: "04:00"
      timezone: Europe/Berlin
  - package-ecosystem: opentofu
    directory: /infra/ci-cloud/gcp-rocky
    schedule:
      interval: daily
      time: "04:00"
      timezone: Europe/Berlin
