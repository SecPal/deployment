name: Cloud TTL Janitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: cloud-ttl-janitor
  cancel-in-progress: false

jobs:
  digitalocean:
    name: Delete expired owned DigitalOcean droplets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ci-cloud-digitalocean-cleanup
    steps:
      - name: Checkout trusted janitor from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Delete only revalidated expired droplets
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          scripts/ci-cloud/digitalocean-janitor.py \
            --apply \
            --now "$(date -u +%s)"

  gcp:
    name: Delete expired owned GCP fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ci-cloud-gcp-cleanup
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout trusted GCP janitor from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Validate closed GCP janitor identity configuration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          [[ "$GCP_PROJECT_ID" == secpal-dev ]]
          [[ "$GCP_WORKLOAD_IDENTITY_PROVIDER" == \
            projects/94792370946/locations/global/workloadIdentityPools/secpal/providers/github ]]
          [[ "$GCP_SERVICE_ACCOUNT" == \
            gcp-service-account@secpal-dev.iam.gserviceaccount.com ]]

      - name: Authenticate trusted GCP janitor through OIDC
        id: gcp_janitor_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 900s
          create_credentials_file: false
          export_environment_variables: false

      - name: Delete only revalidated expired GCP instances and disks
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.gcp_janitor_auth.outputs.access_token }}
        run: |
          [[ "$GCP_PROJECT_ID" == secpal-dev ]]
          scripts/ci-cloud/gcp-janitor.py \
            --project "$GCP_PROJECT_ID" \
            --zone europe-west3-a \
            --apply \
            --now "$(date -u +%s)"
