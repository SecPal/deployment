name: Daily Repository Security

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-security:
    name: Assess accepted source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require an accepted source event
        shell: bash
        run: |
          if [[ ( "$GITHUB_EVENT_NAME" != schedule && "$GITHUB_EVENT_NAME" != workflow_dispatch ) ||
                "$GITHUB_REPOSITORY" != SecPal/deployment ||
                "$GITHUB_REF" != refs/heads/main ||
                "$GITHUB_REF_PROTECTED" != true ||
                ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'Daily source security requires protected SecPal/deployment main and an exact event commit.\n' >&2
            exit 1
          fi

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Scan exact source with organization policy
        id: scan
        uses: SecPal/.github/.github/actions/trivy-repository-scan@d3044d801cacb5aebf87d42744e918128c115207 # main

      - name: Require clean source security
        env:
          SCAN_RESULT: ${{ steps.scan.outcome }}
          GATE_STATE: ${{ steps.scan.outputs.gate-state }}
        run: bash scripts/require-repository-security.sh "$SCAN_RESULT" "$GATE_STATE"
