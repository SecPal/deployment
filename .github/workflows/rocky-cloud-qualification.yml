---
# SPDX-FileCopyrightText: 2026 SecPal Contributors
# SPDX-License-Identifier: CC0-1.0

name: Retained Rocky GCP State Cleanup

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Recover and destroy exact retained state only
        required: true
        type: choice
        options:
          - destroy
      target_sha:
        description: Exact target SHA from the retained continuation
        required: true
        type: string
      provider_profile:
        description: Reviewed current Rocky provider profile
        required: true
        type: choice
        options:
          - gcp-rocky-10-2-arm64
          - gcp-rocky-10-2-x86-64
      continuation_run_id:
        description: Exact retained preparation run ID for cleanup
        required: true
        type: string
      continuation_run_attempt:
        description: Exact retained preparation run attempt for cleanup
        required: true
        type: string

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: rocky-cloud-${{ inputs.continuation_run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate closed lifecycle selection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      operation: ${{ steps.closed.outputs.operation }}
      provider_profile: ${{ steps.closed.outputs.provider_profile }}
      target_sha: ${{ steps.closed.outputs.target_sha }}
      source_run_id: ${{ steps.closed.outputs.source_run_id }}
      source_run_attempt: ${{ steps.closed.outputs.source_run_attempt }}
      source_continuation_artifact: ${{ steps.closed.outputs.source_continuation_artifact }}
      source_state_artifact: ${{ steps.closed.outputs.source_state_artifact }}
    steps:
      - name: Checkout trusted architecture gate from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up reviewed architecture-gate Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.13"

      - name: Install pinned trusted-control validators
        run: >-
          python -m pip install --disable-pip-version-check
          jsonschema==4.25.1 PyYAML==6.0.2

      - name: Validate Rocky evidence architecture and trusted control before provider authority
        run: |
          scripts/validate-ci-cloud.py
          scripts/validate-rocky-evidence-architecture.py
          python3 tests/rocky-workload-integration.py

      - name: Validate immutable inputs
        id: closed
        env:
          RAW_OPERATION: ${{ inputs.operation }}
          RAW_TARGET_SHA: ${{ inputs.target_sha }}
          RAW_PROFILE: ${{ inputs.provider_profile }}
          RAW_SOURCE_RUN_ID: ${{ inputs.continuation_run_id }}
          RAW_SOURCE_RUN_ATTEMPT: ${{ inputs.continuation_run_attempt }}
          IS_DEFAULT_BRANCH: ${{ github.ref == 'refs/heads/main' }}
        run: |
          readonly expected_target_sha=402c22b0a1d69a5a3dba74ffb68cf016caba606b
          readonly expected_harness_sha256=436756f79c7f120d5c4b9fc15b12b2fd91da0fdea5e93ed2907172a73c2861ac
          readonly historical_cleanup_target_sha=293977ae93408a7bb812619de58649ab8a92d438
          [[ "$IS_DEFAULT_BRANCH" == true ]]
          [[ "$RAW_TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$(sha256sum scripts/qualify-production-host.sh | awk '{print $1}')" == \
            "$expected_harness_sha256" ]]
          case "$RAW_PROFILE" in
            gcp-rocky-10-2-arm64 | gcp-rocky-10-2-x86-64) ;;
            *) exit 1 ;;
          esac
          case "$RAW_OPERATION" in
            destroy)
              [[ "${RAW_TARGET_SHA,,}" == "$expected_target_sha" ||
                "${RAW_TARGET_SHA,,}" == "$historical_cleanup_target_sha" ]]
              [[ "$RAW_SOURCE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
              [[ "$RAW_SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,2}$ ]]
              ;;
            *) exit 1 ;;
          esac
          {
            printf 'operation=%s\n' "$RAW_OPERATION"
            printf 'provider_profile=%s\n' "$RAW_PROFILE"
            printf 'target_sha=%s\n' "${RAW_TARGET_SHA,,}"
            printf 'source_run_id=%s\n' "$RAW_SOURCE_RUN_ID"
            printf 'source_run_attempt=%s\n' "$RAW_SOURCE_RUN_ATTEMPT"
            printf 'source_continuation_artifact=rocky-cloud-continuation-%s-%s\n' \
              "$RAW_SOURCE_RUN_ID" "$RAW_SOURCE_RUN_ATTEMPT"
            printf 'source_state_artifact=rocky-cloud-state-%s-%s\n' \
              "$RAW_SOURCE_RUN_ID" "$RAW_SOURCE_RUN_ATTEMPT"
          } >>"$GITHUB_OUTPUT"

  cleanup:
    name: Destroy exact retained state and verify provider absence
    needs: validate
    if: ${{ needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ci-cloud-gcp-cleanup
    env:
      TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
      PROVIDER_PROFILE: ${{ needs.validate.outputs.provider_profile }}
      SOURCE_RUN_ID: ${{ needs.validate.outputs.source_run_id }}
      SOURCE_RUN_ATTEMPT: ${{ needs.validate.outputs.source_run_attempt }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout trusted exact cleanup from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Retrieve exact retained continuation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.validate.outputs.source_continuation_artifact }}
          run-id: ${{ needs.validate.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/rocky-cleanup

      - name: Retrieve exact retained state
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.validate.outputs.source_state_artifact }}
          run-id: ${{ needs.validate.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/rocky-cleanup

      - name: Admit continuation before cross-run cleanup
        env:
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
          SOURCE_RUN_ID: ${{ needs.validate.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ needs.validate.outputs.source_run_attempt }}
          PROVIDER_PROFILE: ${{ needs.validate.outputs.provider_profile }}
        run: |
          scripts/ci-cloud/rocky-control.py validate-continuation \
            "$RUNNER_TEMP/rocky-cleanup/continuation.json" \
            --profile "$PROVIDER_PROFILE" \
            --control-sha "$GITHUB_SHA" --target-sha "$TARGET_SHA" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --now "$(date -u +%s)" \
            --allow-expired-for-destroy --allow-control-sha-mismatch-for-destroy
          continuation="$RUNNER_TEMP/rocky-cleanup/continuation.json"
          variables="$RUNNER_TEMP/rocky-cleanup/run.auto.tfvars.json"
          [[ "$(jq -er .trusted_control_sha "$continuation")" == \
            "$(jq -er .trusted_control_sha "$variables")" ]]
          [[ "$(jq -er .target_sha "$continuation")" == \
            "$(jq -er .target_sha "$variables")" ]]
          [[ "$(jq -er .run_id "$continuation")" == \
            "$(jq -er .run_id "$variables")" ]]
          [[ "$(jq -er .run_attempt "$continuation")" == \
            "$(jq -er .run_attempt "$variables")" ]]
          [[ "$(jq -er .exact_image_self_link "$continuation")" == \
            "$(jq -er .exact_image_self_link "$variables")" ]]
          [[ "$(jq -er .profile "$continuation")" == \
            "$(jq -er .profile "$variables")" ]]
          [[ "$(jq -er .created_at "$continuation")" == \
            "$(jq -er .created_at "$variables")" ]]
          [[ "$(jq -er .expires_at "$continuation")" == \
            "$(jq -er .expires_at "$variables")" ]]
          printf 'SOURCE_CONTROL_SHA=%s\n' \
            "$(jq -er .trusted_control_sha "$continuation")" >>"$GITHUB_ENV"

      - name: Authenticate retained source before cleanup authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timeout 30s gh api "repos/SecPal/deployment/actions/runs/$SOURCE_RUN_ID/attempts/$SOURCE_RUN_ATTEMPT" |
            jq -e --arg run "$SOURCE_RUN_ID" --arg attempt "$SOURCE_RUN_ATTEMPT" --arg sha "$SOURCE_CONTROL_SHA" '
              (.id | tostring) == $run and (.run_attempt | tostring) == $attempt and
              .event == "workflow_dispatch" and .status == "completed" and
              .head_branch == "main" and .head_sha == $sha and
              .head_repository.full_name == "SecPal/deployment" and
              .path == ".github/workflows/rocky-cloud-qualification.yml"' >/dev/null
          timeout 30s gh api "repos/SecPal/deployment/commits/$SOURCE_CONTROL_SHA" |
            jq -e '.commit.verification | .verified == true and .reason == "valid"' >/dev/null
          timeout 30s gh api "repos/SecPal/deployment/compare/$SOURCE_CONTROL_SHA...$GITHUB_SHA" |
            jq -e --arg sha "$SOURCE_CONTROL_SHA" '.merge_base_commit.sha == $sha' >/dev/null

      - name: Restore exact state into the locked root
        run: |
          install -m 0600 "$RUNNER_TEMP/rocky-cleanup/terraform.tfstate" \
            infra/ci-cloud/gcp-rocky/terraform.tfstate

      - name: Set up pinned OpenTofu for cleanup
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Initialize locked exact cleanup root
        working-directory: infra/ci-cloud/gcp-rocky
        run: |
          "$GITHUB_WORKSPACE/scripts/ci-cloud/init-cleanup-root.sh"

      - name: Authenticate separate exact cleanup authority through OIDC
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          [[ "$GCP_PROJECT_ID" == secpal-dev ]]
          [[ "$GCP_WORKLOAD_IDENTITY_PROVIDER" == projects/94792370946/locations/global/workloadIdentityPools/secpal/providers/github ]]
          [[ "$GCP_SERVICE_ACCOUNT" == gcp-service-account@secpal-dev.iam.gserviceaccount.com ]]

      - name: Authenticate separate exact cleanup authority through OIDC
        id: cleanup_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          # Cover the full 25-minute job even after bounded exact cleanup.
          access_token_lifetime: 1800s
          create_credentials_file: false
          export_environment_variables: false

      - name: Reconcile and remove only independently admitted exact run resources
        id: provider_cleanup
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.cleanup_auth.outputs.access_token }}
        run: |
          scripts/ci-cloud/gcp-rocky-janitor.py \
            --project secpal-dev --region europe-west3 --zone europe-west3-a \
            --now "$(date -u +%s)" --exact-action cleanup \
            --variables "$RUNNER_TEMP/rocky-cleanup/run.auto.tfvars.json"

      - name: Destroy exact state and prove it empty
        working-directory: infra/ci-cloud/gcp-rocky
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.cleanup_auth.outputs.access_token }}
        run: |
          tofu destroy --auto-approve --input=false
          test -z "$(tofu state list)"

      - name: Independently prove complete provider run resource absence
        id: provider_absence
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.cleanup_auth.outputs.access_token }}
        run: |
          scripts/ci-cloud/gcp-rocky-janitor.py \
            --project secpal-dev --region europe-west3 --zone europe-west3-a \
            --now "$(date -u +%s)" --exact-action verify \
            --variables "$RUNNER_TEMP/rocky-cleanup/run.auto.tfvars.json"
          printf '%s\n' OPEN_TOFU_STATE_EMPTY PROVIDER_RUN_RESOURCE_SET_ABSENT
