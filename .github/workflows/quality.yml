# SPDX-License-Identifier: CC0-1.0

name: Repository Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-security:
    name: Repository Security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      gate-state: ${{ steps.scan.outputs.gate-state }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Scan exact source with organization policy
        id: scan
        uses: SecPal/.github/.github/actions/trivy-repository-scan@72e3b32a88513f381aa6cd769618bf197106d794 # main

      - name: Require clean source security
        env:
          SCAN_RESULT: ${{ steps.scan.outcome }}
          GATE_STATE: ${{ steps.scan.outputs.gate-state }}
        run: bash scripts/require-repository-security.sh "$SCAN_RESULT" "$GATE_STATE"

  repository-contract:
    name: Repository Contract
    needs: repository-security
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require successful source-security admission
        env:
          SCAN_RESULT: ${{ needs.repository-security.result }}
          GATE_STATE: ${{ needs.repository-security.outputs.gate-state }}
        run: bash scripts/require-repository-security.sh "$SCAN_RESULT" "$GATE_STATE"

      - name: Validate repository contract
        run: bash tests/repository-contract.sh

      - name: Check whitespace errors
        run: git diff --check

  openssh-account-contract:
    name: OpenSSH Account Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install isolated OpenSSH test daemon
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          sudo systemctl mask --runtime ssh.service ssh.socket
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get install --yes --no-install-recommends openssh-server
          dpkg-query -W -f='${binary:Package} ${Version}\n' openssh-server

      - name: Exercise real OpenSSH account accessibility
        shell: bash --noprofile --norc -euo pipefail {0}
        run: sudo bash tests/ci-cloud-openssh-account.sh

  reuse:
    name: REUSE Compliance
    uses: SecPal/.github/.github/workflows/reusable-reuse.yml@7950baada504221da58054b2173d0612164183dd # main

  markdown-shell:
    name: Markdown and Shell
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install pinned lint tools
        run: |
          npm install --global markdownlint-cli@0.49.0 prettier@3.5.3
          python -m pip install --disable-pip-version-check \
            jsonschema==4.25.1 PyYAML==6.0.2 reuse==6.1.2 \
            shellcheck-py==0.11.0.1 yamllint==1.37.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.8
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set up pinned OpenTofu for exact metadata rendering
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Run repository preflight
        run: ./scripts/preflight.sh
