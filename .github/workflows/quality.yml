name: Repository Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contract:
    name: Repository Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate repository contract
        run: bash tests/repository-contract.sh

      - name: Check whitespace errors
        run: git diff --check

  reuse:
    name: REUSE Compliance
    uses: SecPal/.github/.github/workflows/reusable-reuse.yml@75bd30d419c5a85422cec10cc5480bf198ee9424 # main

  markdown-shell:
    name: Markdown and Shell
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install pinned lint tools
        run: |
          npm install --global markdownlint-cli@0.49.0 prettier@3.5.3
          python -m pip install --disable-pip-version-check \
            jsonschema==4.25.1 PyYAML==6.0.2 reuse==6.1.2 \
            shellcheck-py==0.11.0.1 yamllint==1.37.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.8
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run repository preflight
        run: ./scripts/preflight.sh
