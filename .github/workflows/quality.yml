# SPDX-License-Identifier: CC0-1.0

name: Repository Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-analysis:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
      - name: Analyze source
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  repository-security:
    name: Repository Security
    needs: source-analysis
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      gate-state: ${{ steps.scan.outputs.gate-state }}
    steps:
      - name: Reject a cancelled workflow
        if: ${{ cancelled() }}
        run: exit 1

      - name: Require successful CodeQL analyses
        if: ${{ always() }}
        env:
          ANALYSIS_RESULT: ${{ needs.source-analysis.result }}
        run: test "$ANALYSIS_RESULT" = success

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Scan exact source with organization policy
        id: scan
        uses: SecPal/.github/.github/actions/trivy-repository-scan@21456aaffba1519ced825347361b4237eddd955d # main

      - name: Require clean source security
        env:
          SCAN_RESULT: ${{ steps.scan.outcome }}
          GATE_STATE: ${{ steps.scan.outputs.gate-state }}
        run: bash scripts/require-repository-security.sh "$SCAN_RESULT" "$GATE_STATE"

  repository-contract:
    name: Repository Contract
    needs: repository-security
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require successful source-security admission
        env:
          SCAN_RESULT: ${{ needs.repository-security.result }}
          GATE_STATE: ${{ needs.repository-security.outputs.gate-state }}
        run: bash scripts/require-repository-security.sh "$SCAN_RESULT" "$GATE_STATE"

      - name: Validate repository contract
        run: bash tests/repository-contract.sh

      - name: Check whitespace errors
        run: git diff --check

  openssh-account-contract:
    name: OpenSSH Account Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install isolated OpenSSH test daemon
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          sudo systemctl mask --runtime ssh.service ssh.socket
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get install --yes --no-install-recommends openssh-server
          dpkg-query -W -f='${binary:Package} ${Version}\n' openssh-server

      - name: Exercise real OpenSSH account accessibility
        shell: bash --noprofile --norc -euo pipefail {0}
        run: sudo bash tests/ci-cloud-openssh-account.sh

  reuse:
    name: REUSE Compliance
    uses: SecPal/.github/.github/workflows/reusable-reuse.yml@2d02204e03a7d93132fcbcba45cdff1161017e11 # main

  markdown-shell:
    name: Markdown and Shell
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      - name: Install pinned lint tools
        run: |
          npm install --global markdownlint-cli@0.49.0 prettier@3.5.3
          python -m pip install --disable-pip-version-check --no-deps \
            --build-constraint requirements/build/requirements.txt \
            --requirement requirements/quality/requirements.txt
          python -m pip check
          go install actionlint.kjanat.dev/cmd/actionlint@v1.17.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set up pinned OpenTofu for retained recovery contracts
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Run repository preflight
        run: ./scripts/preflight.sh
