---
name: Dependabot Auto-Merge
on:
  # Run only the accepted immutable callee, never PR-controlled source.
  pull_request_target:
    types:
      [
        opened,
        synchronize,
        reopened,
        ready_for_review,
        labeled,
        unlabeled,
        edited,
        converted_to_draft,
      ]

cache-mode: none
permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
concurrency:
  group: ${{ github.repository }}-dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  auto-merge:
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-dependabot-auto-merge.yml@482d55cf6732dd27c7075283b2a8055259f5c3c6 # main
    with:
      phase: "2"
      merge-method: squash
      allowed-ecosystems: github_actions,npm_and_yarn,pre_commit,docker
      pre-commit-path: ".pre-commit-config.yaml"
      docker-rules: >-
        [{"image":"library/caddy","paths":["containers/phase-b-gateway/Containerfile"],"line":"2.11","suffix":"-alpine","digestRefresh":true}]
      workflow-paths: >-
        [".github/workflows/quality.yml",".github/workflows/local-integration.yml",".github/workflows/rocky-evidence-architecture.yml"]
