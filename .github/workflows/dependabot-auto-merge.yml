---
name: Dependabot Auto-Merge
on:
  # Run only the accepted immutable callee, never PR-controlled source.
  pull_request_target:
    types:
      [
        opened,
        synchronize,
        reopened,
        ready_for_review,
        labeled,
        unlabeled,
        edited,
        converted_to_draft,
      ]

# The accepted immutable callee disables cache access.
permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
concurrency:
  group: ${{ github.repository }}-dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  auto-merge:
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-dependabot-auto-merge.yml@31555f23d459031248006f77785d872bc3947127 # main
    with:
      phase: "2"
      merge-method: squash
      allowed-ecosystems: github_actions
      workflow-paths: >-
        [".github/workflows/quality.yml",".github/workflows/local-integration.yml",".github/workflows/rocky-evidence-architecture.yml"]
