name: Local Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: local-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-contract:
    name: Compose Contract
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned GitHub CLI
        env:
          GH_VERSION: "2.97.0"
          GH_LINUX_AMD64_SHA256: "a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112"
        run: |
          archive="$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GH_LINUX_AMD64_SHA256" "$archive" | \
            sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" \
            --no-same-owner
          install -d -m 0755 "$RUNNER_TEMP/gh-bin"
          install -m 0755 \
            "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin/gh" \
            "$RUNNER_TEMP/gh-bin/gh"
          echo "$RUNNER_TEMP/gh-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gh-bin/gh" version

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"

      - name: Install browser and validation dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm install --global markdownlint-cli@0.49.0 prettier@3.5.3
          python -m pip install --disable-pip-version-check \
            reuse==6.1.2 shellcheck-py==0.11.0.1 yamllint==1.37.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.8
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run static preflight
        run: ./scripts/preflight.sh

      - name: Run real Compose integration
        run: ./scripts/local-integration.sh
