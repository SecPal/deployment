name: FCOS Lab Release Discovery

on:
  schedule:
    - cron: "37 8 * * 1-5"
  workflow_dispatch:

permissions: {}

concurrency:
  group: fcos-lab-release-discovery
  cancel-in-progress: false

jobs:
  candidate-report:
    if: github.repository == 'SecPal/deployment' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      proposal: ${{ steps.frontend.outputs.proposal }}
      backend-proposal: ${{ steps.backend.outputs.proposal }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Report upstream candidates
        id: discovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidates="$(python3 scripts/fcos_lab_discovery.py)"
          printf 'candidates=%s\n' "$(jq -c . <<< "$candidates")" >> "$GITHUB_OUTPUT"
          {
            printf '## FCOS lab candidates\n\n'
            printf '%s\n' "$candidates" | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify eligible frontend publisher evidence
        id: frontend
        env:
          GH_TOKEN: ${{ github.token }}
          FCOS_FRONTEND_ACTIONS_READ_TOKEN: ${{ secrets.FCOS_FRONTEND_ACTIONS_READ_TOKEN }}
          CANDIDATES: ${{ steps.discovery.outputs.candidates }}
        run: |
          set -euo pipefail
          proposal="$(jq -c '.frontend' <<< "$CANDIDATES" | python3 scripts/fcos_lab_proposal.py verify)"
          printf 'proposal=%s\n' "$proposal" >> "$GITHUB_OUTPUT"
          if [[ -n "$proposal" ]]; then
            status='Verified a frontend lab proposal.'
          else
            status='No eligible frontend proposal.'
          fi
          printf '%s\n' "$status" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify eligible backend publisher evidence
        if: ${{ !cancelled() && steps.discovery.outcome == 'success' }}
        id: backend
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATES: ${{ steps.discovery.outputs.candidates }}
        run: |
          set -euo pipefail
          proposal="$(jq -c '.api' <<< "$CANDIDATES" | python3 scripts/fcos_lab_proposal.py backend-verify)"
          printf 'proposal=%s\n' "$proposal" >> "$GITHUB_OUTPUT"
          if [[ -n "$proposal" ]]; then
            status='Verified a backend lab proposal. Compatibility evidence is outstanding.'
          else
            status='No eligible backend proposal.'
          fi
          printf '%s\n' "$status" | tee -a "$GITHUB_STEP_SUMMARY"

  draft-proposal:
    needs: candidate-report
    if: >-
      !cancelled() &&
      github.repository == 'SecPal/deployment' &&
      github.ref == 'refs/heads/main' &&
      vars.FCOS_LAB_RELEASE_PROPOSALS == 'true' &&
      (needs.candidate-report.outputs.proposal != '' || needs.candidate-report.outputs.backend-proposal != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare a signed frontend draft on a proposal branch
        if: needs.candidate-report.outputs.proposal != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FCOS_FRONTEND_PROPOSAL_WRITE_TOKEN: ${{ secrets.FCOS_FRONTEND_PROPOSAL_WRITE_TOKEN }}
          PROPOSAL: ${{ needs.candidate-report.outputs.proposal }}
        run: |
          set -euo pipefail
          printf '%s\n' "$PROPOSAL" | python3 scripts/fcos_lab_proposal.py publish

      - name: Prepare a signed backend draft on a proposal branch
        if: ${{ !cancelled() && needs.candidate-report.outputs.backend-proposal != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          FCOS_FRONTEND_PROPOSAL_WRITE_TOKEN: ${{ secrets.FCOS_FRONTEND_PROPOSAL_WRITE_TOKEN }}
          PROPOSAL: ${{ needs.candidate-report.outputs.backend-proposal }}
        run: |
          set -euo pipefail
          printf '%s\n' "$PROPOSAL" | python3 scripts/fcos_lab_proposal.py backend-publish
