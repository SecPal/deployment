---
repos:
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.1.2
    hooks:
      - id: reuse

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx --yes prettier@3.5.3 --write
        language: system
        types_or: [markdown, yaml, json]
      - id: markdownlint
        name: markdownlint
        entry: >-
          npx --yes --package markdownlint-cli@0.49.0 markdownlint --config
          .markdownlint.json
        language: system
        types: [markdown]
      - id: repository-preflight
        name: SecPal deployment preflight
        entry: scripts/preflight.sh
        language: system
        pass_filenames: false

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint.yml"]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.8
    hooks:
      - id: actionlint

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=lf"]
