---
extends: default

rules:
  line-length:
    max: 120
    level: warning
  key-ordering: disable
  colons:
    max-spaces-after: -1
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  empty-values:
    forbid-in-block-mappings: false
    forbid-in-flow-mappings: false
  truthy:
    allowed-values: ["true", "false", "on", "off"]
    check-keys: false
